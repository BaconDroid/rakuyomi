name: "Build"
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  luacheck:
    uses: ./.github/workflows/luacheck.yml
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    # The build matrix is expensive, so only start it after the tests pass:
    # the ci job runs the full test suite once for this workflow.
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["aarch64", "desktop", "kindle", "kindlehf", "kindlea9"]

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v5

    - name: Install system deps
      run: |
        sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext
        echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Cache Podman images
      uses: actions/cache@v5
      with:
        path: |
          ~/.local/share/containers
        key: ${{ runner.os }}-podman-cross-${{ matrix.target }}

    - name: Install Rust stable
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable

    - name: Install cross
      run: cargo install cross

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Cache Rust Dependencies
      uses: swatinem/rust-cache@v2
      with:
        workspaces: "backend -> target"
        prefix-key: "rust-cache-${{ matrix.target }}"

    - name: Install dependencies
      run: npm install
    - name: Get next version
      if: github.ref == 'refs/heads/main'
      run: npx semantic-release --dry-run
      id: get-next-version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build plugin
      run: |
        export SEMANTIC_RELEASE_VERSION="${{ steps.get-next-version.outputs.new-release-git-tag }}"
        # Using `--impure` here kinda sucks, but it's needed so that we can insert the `semantic-release`
        # version into the build.
        bash scripts/build-all.sh ${{ matrix.target }}
    - name: Package plugin contents
      run: "cd build && zip -r rakuyomi-${{ matrix.target }}.zip rakuyomi.koplugin"
    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.target }} build
        path: build/rakuyomi-${{ matrix.target }}.zip

  # Separate from the matrix above because release must not depend on it: a
  # macOS runner is not always assigned, and a cancelled job would skip the
  # release for every other target.
  build-macos:
    needs: [ci]
    runs-on: macos-14
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v5

    - name: Install system deps
      run: |
        brew install gettext bash
        echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix bash)/bin" >> $GITHUB_PATH

    - name: Install Rust stable
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add aarch64-apple-darwin

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: npm install
    - name: Get next version
      if: github.ref == 'refs/heads/main'
      run: npx semantic-release --dry-run
      id: get-next-version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build plugin
      run: |
        export SEMANTIC_RELEASE_VERSION="${{ steps.get-next-version.outputs.new-release-git-tag }}"
        bash scripts/build-all.sh macos
    - name: Package plugin contents
      run: "cd build && zip -r rakuyomi-macos.zip rakuyomi.koplugin"
    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v6
      with:
        name: macos build
        path: build/rakuyomi-macos.zip

  generate-settings-schema:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Install system deps
      run: sudo apt update && sudo apt install -y pkg-config libfontconfig1-dev libfreetype6-dev podman gettext && echo "CROSS_CONTAINER_ENGINE=podman" >> $GITHUB_ENV

    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
 
    - name: Install Rust stable
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt --component clippy
        rustup default stable

    - name: Setup bun
      uses: oven-sh/setup-bun@v2
      with:
        # bun.lock files use the v1 format (stable bun)
        bun-version: 1.3.14

    - name: Build settings schema
      run: bash scripts/generate-settings-schema.sh

    - name: Upload plugin as workflow artifact
      uses: actions/upload-artifact@v6
      with:
        name: settings.schema.json
        path: build/settings.schema.json
  
  release:
    runs-on: ubuntu-latest
    needs: [build, generate-settings-schema]
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: true
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "lts/*"
    - name: Install dependencies
      run: npm install
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        path: build
        merge-multiple: true
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HUSKY: 0
      run: npx semantic-release
