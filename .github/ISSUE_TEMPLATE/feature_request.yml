name: Feature request
description: Suggest a behaviour or an option the plugin should have
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation where the plugin gets in the way, rather than the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour or setting you expect, and the screen it belongs to.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Library view
        - Reader
        - Sources and downloads
        - Settings
        - Tracking integrations
        - Other
    validations:
      required: true
