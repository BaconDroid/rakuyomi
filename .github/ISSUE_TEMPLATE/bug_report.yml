name: Bug report
description: Something in the plugin itself misbehaves, on any screen or device
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the problem is one specific source returning wrong results or a 403, use the **Extension bug report** template instead.

        Check the [user guide](https://bacondroid.github.io/rakuyomi/) and the [latest release](https://github.com/BaconDroid/rakuyomi/releases) before filing.

  - type: input
    id: version
    attributes:
      label: RakuYomi version
      description: Rakuyomi > Settings, or `BUILD_INFO.json` inside the zip you installed.
      placeholder: "1.45.1"
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Kindle
        - Kobo
        - PocketBook
        - reMarkable
        - Desktop Linux
        - macOS (Apple Silicon)
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happens
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Rakuyomi > Settings > View logs. Include the entry that names the failure, not the whole file. Remove cookies, tokens and source URLs before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest release.
          required: true
        - label: I removed secrets (cookies, tokens, source URLs) from everything above.
          required: true
